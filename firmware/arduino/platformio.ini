[platformio]
default_envs = esp32

[env]
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_ldf_mode = deep+
lib_deps =
    ; Pinned exactly. 3.10.3 locks the WebSocket client list (AsyncWebSocket::_lock, ESP32Async PR #414).
    ; From 3.12.0 the library closes a connection inside AsyncTCP's receive callback when the browser
    ; sends CLOSE; the disconnect lambda deletes the AsyncClient and AsyncClient::_recv() then reads
    ; its _pcb (AsyncTCP 3.5.0 AsyncTCP.cpp:1093-1098). Re-run the bench churn test
    ; (tests/e2e/bench.spec.ts C1) before moving either pin.
    esp32async/ESPAsyncWebServer @ 3.10.3
    esp32async/AsyncTCP @ 3.4.10
    bblanchon/ArduinoJson @ ^7.0.0
build_flags =
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DMUNDMAUS_VERSION=\"4.2.16\"
    -DMUNDMAUS_FW_VERSION=4216
    ; OTA_AUTH_B64 injected by pre-script from ota_auth.py (or env var)
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
    -Wno-unused-parameter      ; Arduino callbacks often have unused params
    -Wno-missing-field-initializers  ; ArduinoJson triggers this
build_unflags = -std=gnu++11
extra_scripts = pre:fix_arduino3_deps.py
check_tool = cppcheck, clangtidy
check_flags =
    cppcheck: --enable=all --suppress=missingIncludeSystem --suppress=missingInclude:*/libdeps/* --suppress=unusedFunction --suppress=unmatchedSuppression --inline-suppr
    clangtidy: --checks=-*,bugprone-*,performance-*,readability-*,modernize-*,clang-analyzer-*,cert-*,concurrency-*,misc-*,-bugprone-easily-swappable-parameters,-bugprone-narrowing-conversions,-bugprone-branch-clone,-readability-magic-numbers,-cert-err58-cpp,-misc-non-private-member-variables-in-classes,-misc-include-cleaner,-readability-identifier-length,-readability-function-cognitive-complexity --fix-errors=false
check_severity = low
; Only our sources: cppcheck cannot parse the toolchain's C++ headers (syntaxError in
; type_traits:788 of gcc 14.2) and PlatformIO treats that as a breaking defect, so the
; pre-build lint gate failed on every build that had to re-lint.
check_skip_packages = yes

[env:esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32dev
board_build.partitions = partitions_ota.csv
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32_WROOM
    -DPIN_VRX=33
    -DPIN_VRY=35
    -DPIN_SW=21
    -DPIN_PUFF_DATA=32
    -DPIN_PUFF_CLK=25

; Bench-only build with test hooks (see MUNDMAUS_TEST_HOOKS in web_server.cpp).
; Never deployed: tools/deploy-ota.sh ships the esp32 image only.
[env:esp32_testhooks]
extends = env:esp32
build_flags =
    ${env:esp32.build_flags}
    -DMUNDMAUS_TEST_HOOKS

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_build.partitions = default_8MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32_S3
    -DPIN_VRX=1
    -DPIN_VRY=2
    -DPIN_SW=42
    -DPIN_PUFF_DATA=4
    -DPIN_PUFF_CLK=5
