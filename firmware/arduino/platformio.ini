[platformio]
default_envs = esp32

[env]
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_ldf_mode = deep+
lib_deps =
    ; Pinned exactly. 3.10.3 locks the WebSocket client list (AsyncWebSocket::_lock, ESP32Async PR #414).
    ; From 3.12.0 the library closes a connection inside AsyncTCP's receive callback when the browser
    ; sends CLOSE; the disconnect lambda deletes the AsyncClient and AsyncClient::_recv() then reads
    ; its _pcb (AsyncTCP 3.5.0 AsyncTCP.cpp:1093-1098). Re-run the bench churn test
    ; (tests/e2e/bench.spec.ts C1) before moving either pin.
    esp32async/ESPAsyncWebServer @ 3.10.3
    esp32async/AsyncTCP @ 3.4.10
    bblanchon/ArduinoJson @ ^7.0.0
build_flags =
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DMUNDMAUS_VERSION=\"4.2.16\"
    -DMUNDMAUS_FW_VERSION=4216
    ; OTA_AUTH_B64 injected by pre-script from ota_auth.py (or env var)
    -std=gnu++17
; Warnings are errors in our code only: in build_flags they would also apply to the framework and
; the libraries, whose warnings are not ours to fix. From -Wsign-compare on, our code gets back what
; the framework's own flags (platform 55.03.37) switch off for every file. -Wunused-parameter stays
; off: the ESPAsyncWebServer 3.10.3 headers have unused parameters (ESPAsyncWebServer.h:1593).
build_src_flags =
    -Wall
    -Wextra
    -Werror
    -Wsign-compare
    -Werror=unused-function
    -Werror=unused-variable
    -Werror=unused-but-set-variable
    -Werror=deprecated-declarations
    -Werror=extra
build_unflags = -std=gnu++11
extra_scripts = pre:fix_arduino3_deps.py
; Static analysis is the pre-build gate (tools/lint_firmware.py): ONE cppcheck run over src/, without
; framework and library headers. `pio check` is not that gate: it runs cppcheck once per file, which
; breaks unusedFunction and the report of stale suppressions. clang-tidy: task a117.
custom_cppcheck_flags =
    --enable=all
    --inline-suppr
    ; <...> includes are the framework and the libraries, left out on purpose.
    --suppress=missingIncludeSystem

[env:esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32dev
board_build.partitions = partitions_ota.csv
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32_WROOM
    -DPIN_VRX=33
    -DPIN_VRY=35
    -DPIN_SW=21
    -DPIN_PUFF_DATA=32
    -DPIN_PUFF_CLK=25

; Bench-only build with test hooks (see MUNDMAUS_TEST_HOOKS in web_server.cpp).
; Never deployed: tools/deploy-ota.sh ships the esp32 image only.
[env:esp32_testhooks]
extends = env:esp32
build_flags =
    ${env:esp32.build_flags}
    -DMUNDMAUS_TEST_HOOKS

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_build.partitions = default_8MB.csv
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32_S3
    -DPIN_VRX=1
    -DPIN_VRY=2
    -DPIN_SW=42
    -DPIN_PUFF_DATA=4
    -DPIN_PUFF_CLK=5
